name: Publish Open VSX Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-openvsx
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches extension version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Tag must be v${version}`);
          }
          NODE

      # Packaging runs vscode:prepublish, which compiles TypeScript.
      - name: Publish VS Code Extension
        uses: HaaLeo/publish-vscode-extension@v2.1.0
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          packagePath: .
